<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Chat - Krow</title>
    <style>
        body {
            background-color: #0f0f11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: rgba(18, 18, 22, 0.95);
            border-bottom: 1px solid #27272a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-info h2 { margin: 0; font-size: 1.2rem; color: #a855f7; }
        .header-info p { margin: 5px 0 0 0; font-size: 0.85rem; color: #a1a1aa; }
        #chat-contenedor {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .burbuja {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .burbuja.mia {
            background: #a855f7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .burbuja.suya {
            background: #18181b;
            border: 1px solid #27272a;
            color: #e4e4e7;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .remitente {
            font-size: 0.75rem;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        .zona-input {
            background: rgba(18, 18, 22, 0.95);
            border-top: 1px solid #27272a;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }
        #input-mensaje {
            flex: 1;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        #btn-enviar {
            background: #a855f7;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-info">
            <h2 id="ui-titulo">Sala General</h2>
            <p id="ui-subtitulo">Conectando al universo...</p>
        </div>
    </header>

    <div id="chat-contenedor">
    </div>

    <div class="zona-input">
        <input type="text" id="input-mensaje" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="btn-enviar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3_P-pr1TObmm8BREQ2g4uLaDamTRHnGI",
            authDomain: "krow-83002.firebaseapp.com",
            projectId: "krow-83002",
            storageBucket: "krow-83002.firebasestorage.app",
            messagingSenderId: "567485047347",
            appId: "1:567485047347:web:b7fbf4a8b44a657061b946"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const comunidadId = urlParams.get('id');
        const chatId = urlParams.get('chat');
        const targetPjId = urlParams.get('target');
        const miUid = urlParams.get('miUid');
        const miPjId = urlParams.get('miPj');

        let misPersonajes = [];
        let personajeActivo = null;

        const tituloUI = document.getElementById('ui-titulo-chat') || document.getElementById('ui-titulo');
        const subtituloUI = document.getElementById('ui-subtitulo-chat') || document.getElementById('ui-subtitulo');
        const contenedorMensajes = document.getElementById('contenedor-mensajes') || document.getElementById('chat-contenedor');
        const btnVolver = document.getElementById('btn-volver');

        if (btnVolver) {
            btnVolver.href = `perfil.html?id=${comunidadId}&pj=${targetPjId}`;
        }

        async function arrancarChatConLink() {
            if (!miUid || !comunidadId || !chatId) {
                if(tituloUI) tituloUI.textContent = "Error de Enlace";
                if(subtituloUI) subtituloUI.textContent = "Vuelve al perfil y entra de nuevo.";
                return;
            }

            if(tituloUI) tituloUI.textContent = "Cargando personaje...";
            await cargarMisPersonajes();
            inicializarChatPrivado();
        }

        async function cargarMisPersonajes() {
            try {
                const snap = await getDocs(collection(db, `comunidades/${comunidadId}/miembros/${miUid}/personajes`));
                misPersonajes = [];
                snap.forEach(docSnap => misPersonajes.push({ id: docSnap.id, ...docSnap.data() }));

                if (misPersonajes.length > 0) {
                    const guardado = miPjId || localStorage.getItem(`pj_activo_${comunidadId}`);
                    personajeActivo = misPersonajes.find(p => p.id === guardado) || misPersonajes[0];
                }
            } catch (error) {
                console.error("Error al cargar personajes:", error);
            }
        }

        function inicializarChatPrivado() {
            if(tituloUI) tituloUI.textContent = "Sala Privada";
            if(subtituloUI) {
                subtituloUI.textContent = personajeActivo ? `Rol activo como: ${personajeActivo.nombre}` : "Anónimo";
                subtituloUI.style.color = "#a1a1aa";
            }

            if(!contenedorMensajes) return;
            
            const pathColeccion = collection(db, `comunidades/${comunidadId}/chatsPrivados/${chatId}/mensajes`);

            onSnapshot(query(pathColeccion, orderBy("timestamp", "asc")), (snapshot) => {
                contenedorMensajes.innerHTML = "";
                
                if (snapshot.empty) {
                    contenedorMensajes.innerHTML = '<div style="text-align: center; color: #52525b; margin-top: 40px;">No hay mensajes aún. ¡Comienza la escena!</div>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const esMio = personajeActivo && msg.remitenteId === personajeActivo.id;
                    
                    const burbuja = document.createElement('div');
                    burbuja.className = `burbuja ${esMio ? 'mia' : 'suya'}`;
                    burbuja.innerHTML = `
                        <span class="remitente">${msg.remitenteNombre || 'Anónimo'}</span>
                        ${msg.texto}
                    `;
                    contenedorMensajes.appendChild(burbuja);
                });
                contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
            });
        }

        const btnEnviar = document.getElementById('btn-enviar');
        const inputMensaje = document.getElementById('input-mensaje');

        async function enviarMensaje() {
            const texto = inputMensaje.value.trim();
            if (!texto || !personajeActivo) return;

            inputMensaje.value = "";
            try {
                await addDoc(collection(db, `comunidades/${comunidadId}/chatsPrivados/${chatId}/mensajes`), {
                    texto: texto,
                    remitenteId: personajeActivo.id,
                    remitenteNombre: personajeActivo.nombre,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Error al enviar:", error);
            }
        }

        if(btnEnviar) btnEnviar.addEventListener('click', enviarMensaje);
        if(inputMensaje) inputMensaje.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensaje();
            }
        });

        arrancarChatConLink();
    </script>

</body>
</html>
