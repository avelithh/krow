<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Krow</title>
    <!-- Importamos SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #09090b; 
            color: #e0e0e0;
            display: flex;
            min-height: 100vh; 
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .layout-dividido {
            display: flex;
            width: 100%;
        }

        /* --- LADO IZQUIERDO: VISUAL --- */
        .panel-visual {
            flex: 1.2; 
            background: linear-gradient(135deg, rgba(15,12,20,0.85) 0%, rgba(10,8,12,0.4) 100%), 
                        url('https://images.unsplash.com/photo-1604871000636-074fa5117945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
        }

        .panel-visual h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-visual p {
            font-size: 1.1rem;
            color: #b0a8ba;
            margin: 0;
            max-width: 400px;
            line-height: 1.5;
        }

        /* --- LADO DERECHO: FORMULARIO --- */
        .panel-form {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #09090b;
        }

        .form-contenedor {
            width: 100%;
            max-width: 380px;
        }

        .form-contenedor h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333; 
            color: #fff;
            padding: 10px 0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-bottom: 1px solid #e0e0e0;
        }

        /* Enlace de recuperar contraseña */
        .forgot-password {
            text-align: right;
            margin-top: -15px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #777;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #fff;
        }

        /* --- BOTONES --- */
        .btn-primary {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- SEPARADOR Y GOOGLE --- */
        .separador {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        
        .separador::before, .separador::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #222;
        }
        
        .separador span {
            padding: 0 10px;
        }

        .btn-google {
            width: 100%;
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #666;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .links-extra {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .links-extra a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .links-extra a:hover {
            color: #fff;
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            .layout-dividido {
                flex-direction: column; 
            }

            .panel-visual {
                padding: 40px 20px;
                text-align: center;
                align-items: center;
                min-height: 30vh; 
                flex: none;
            }

            .panel-visual h1 {
                font-size: 2.5rem;
            }

            .panel-form {
                padding: 40px 20px;
                align-items: flex-start; 
            }
        }
    </style>
</head>
<body>

    <div class="layout-dividido">
        <!-- MITAD IZQUIERDA -->
        <div class="panel-visual">
            <h1>Krow</h1>
            <p>Cruza de nuevo el umbral. Ingresa a tu expediente y retoma tu rol en las sombras.</p>
        </div>

        <!-- MITAD DERECHA -->
        <div class="panel-form">
            <div class="form-contenedor">
                <h2>Iniciar Sesión</h2>
                
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="usuario@correo.com">
                </div>
                
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>

                <!-- ENLACE DE RECUPERAR CONTRASEÑA -->
                <div class="forgot-password">
                    <a href="#" id="btn-olvide">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button class="btn-primary" id="btn-login">Entrar a Krow</button>

                <!-- SEPARADOR Y BOTÓN DE GOOGLE -->
                <div class="separador">
                    <span>O ENTRA CON</span>
                </div>

                <button class="btn-google" id="btn-google-login">
                    <svg viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>

                <div class="links-extra">
                    <span>¿No tienes expediente?</span>
                    <a href="registro.html">Crear cuenta</a> 
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CEREBRO DE INICIO DE SESIÓN Y RECUPERACIÓN ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3_P-prlT0bmm8bREQ2g4uLaDamTRHnGI",
            authDomain: "krow-83002.firebaseapp.com",
            projectId: "krow-83002",
            storageBucket: "krow-83002.firebasestorage.app",
            messagingSenderId: "567485047347",
            appId: "1:567485047347:web:87fbf4a8b44a657061b946"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const proveedorGoogle = new GoogleAuthProvider();

        const btnLogin = document.getElementById("btn-login");
        const btnGoogleLogin = document.getElementById("btn-google-login");
        const btnOlvide = document.getElementById("btn-olvide");

        // --- LOGIN CON CORREO Y CONTRASEÑA ---
        btnLogin.addEventListener("click", async () => {
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                Swal.fire({
                    title: '¡Bienvenid@ de nuevo!',
                    text: 'Accediendo a tu expediente...',
                    icon: 'success',
                    background: '#09090b',
                    color: '#ffffff',
                    confirmButtonColor: '#ffffff',
                    confirmButtonText: '<span style="color:#000; font-weight:600;">Entrar</span>'
                }).then(() => {
                    window.location.href = "hub.html";
                });
            } catch (error) {
                Swal.fire({
                    title: 'Error de acceso',
                    text: 'Credenciales incorrectas o usuario no encontrado.',
                    icon: 'error',
                    background: '#09090b',
                    color: '#ffffff',
                    confirmButtonColor: '#ffffff',
                    confirmButtonText: '<span style="color:#000; font-weight:600;">Intentar de nuevo</span>'
                });
            }
        });

        // --- RECUPERAR CONTRASEÑA ---
        btnOlvide.addEventListener("click", async (e) => {
            e.preventDefault();
            
            const { value: email } = await Swal.fire({
                title: 'Recuperar Expediente',
                text: 'Ingresa tu correo electrónico y te enviaremos instrucciones.',
                input: 'email',
                inputPlaceholder: 'usuario@correo.com',
                background: '#09090b',
                color: '#ffffff',
                confirmButtonColor: '#ffffff',
                confirmButtonText: '<span style="color:#000; font-weight:600;">Enviar enlace</span>',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                cancelButtonColor: '#222'
            });

            if (email) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    Swal.fire({
                        title: '¡Correo enviado!',
                        text: 'Revisa tu bandeja de entrada para restablecer tu contraseña.',
                        icon: 'success',
                        background: '#09090b',
                        color: '#ffffff',
                        confirmButtonColor: '#ffffff',
                        confirmButtonText: '<span style="color:#000; font-weight:600;">Ok</span>'
                    });
                } catch (error) {
                    Swal.fire({
                        title: 'Error',
                        text: 'No se pudo enviar el correo: ' + error.message,
                        icon: 'error',
                        background: '#09090b',
                        color: '#ffffff',
                        confirmButtonColor: '#ffffff',
                        confirmButtonText: '<span style="color:#000; font-weight:600;">Ok</span>'
                    });
                }
            }
        });

        // --- LOGIN CON GOOGLE ---
        btnGoogleLogin.addEventListener("click", async () => {
            try {
                const resultado = await signInWithPopup(auth, proveedorGoogle);
                Swal.fire({
                    title: '¡Hola de nuevo, ' + resultado.user.displayName + '!',
                    text: 'Reanudando sesión en Krow...',
                    icon: 'success',
                    background: '#09090b',
                    color: '#ffffff',
                    confirmButtonColor: '#ffffff',
                    confirmButtonText: '<span style="color:#000; font-weight:600;">Entrar</span>'
                }).then(() => {
                    window.location.href = "hub.html";
                });
            } catch (error) {
                Swal.fire({
                    title: 'Error con Google',
                    text: error.message,
                    icon: 'error',
                    background: '#09090b',
                    color: '#ffffff',
                    confirmButtonColor: '#ffffff',
                    confirmButtonText: '<span style="color:#000; font-weight:600;">Ok</span>'
                });
            }
        });
    </script>
</body>
</html>
