<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Krow</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #09090b; 
            color: #e0e0e0;
            display: flex;
            min-height: 100vh; 
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .layout-dividido {
            display: flex;
            width: 100%;
        }

        /* --- LADO IZQUIERDO: VISUAL --- */
        .panel-visual {
            flex: 1.2; 
            background: linear-gradient(135deg, rgba(15,12,20,0.85) 0%, rgba(10,8,12,0.4) 100%), 
                        url('https://images.unsplash.com/photo-1604871000636-074fa5117945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            position: relative;
        }

        .panel-visual h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-visual p {
            font-size: 1.1rem;
            color: #b0a8ba;
            margin: 0;
            max-width: 400px;
            line-height: 1.5;
        }

        /* --- LADO DERECHO: FORMULARIO --- */
        .panel-form {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #09090b;
        }

        .form-contenedor {
            width: 100%;
            max-width: 380px;
        }

        .form-contenedor h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333; 
            color: #fff;
            padding: 10px 0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-bottom: 1px solid #e0e0e0;
        }

        /* --- BOTONES --- */
        .btn-primary {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- SEPARADOR Y GOOGLE --- */
        .separador {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        
        .separador::before, .separador::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #222;
        }
        
        .separador span {
            padding: 0 10px;
        }

        .btn-google {
            width: 100%;
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #666;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .links-extra {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .links-extra a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .links-extra a:hover {
            color: #fff;
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            .layout-dividido {
                flex-direction: column; 
            }

            .panel-visual {
                padding: 40px 20px;
                text-align: center;
                align-items: center;
                min-height: 30vh; 
                flex: none;
            }

            .panel-visual h1 {
                font-size: 2.5rem;
            }

            .panel-form {
                padding: 40px 20px;
                align-items: flex-start; 
            }
        }
    </style>
</head>
<body>

    <div class="layout-dividido">
        <!-- MITAD IZQUIERDA -->
        <div class="panel-visual">
            <h1>Krow</h1>
            <p>El primer paso hacia tu nueva realidad. Registra tu correo o usa Google y prepárate para cruzar el umbral.</p>
        </div>

        <!-- MITAD DERECHA -->
        <div class="panel-form">
            <div class="form-contenedor">
                <h2>Crear Cuenta</h2>
                
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <!-- Agregamos id="email" para que el código lo reconozca -->
                    <input type="email" id="email" placeholder="usuario@correo.com">
                </div>
                
                <div class="input-group">
                    <label>Contraseña Secreta</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <div class="input-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••">
                </div>
                
                <button class="btn-primary" id="btn-forjar">Forjar Identidad</button>

                <!-- SEPARADOR Y BOTÓN DE GOOGLE -->
                <div class="separador">
                    <span>O INICIA CON</span>
                </div>

                <button class="btn-google" id="btn-google">
                    <!-- Icono SVG de Google para que se vea premium -->
                    <svg viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>

                <div class="links-extra">
                    <span>¿Ya tienes un expediente?</span>
                    <a href="index.html">Iniciar sesión</a> 
                </div>
            </div>
        </div>
    </div>

    <!-- ===== AQUÍ EMPIEZA EL CEREBRO DE KROW (FIREBASE) ===== -->
    <script type="module">
        // 1. Importamos las herramientas de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        // 2. Tus llaves secretas
        const firebaseConfig = {
            apiKey: "AIzaSyC3_P-prlT0bmm8bREQ2g4uLaDamTRHnGI",
            authDomain: "krow-83002.firebaseapp.com",
            projectId: "krow-83002",
            storageBucket: "krow-83002.firebasestorage.app",
            messagingSenderId: "567485047347",
            appId: "1:567485047347:web:87fbf4a8b44a657061b946"
        };

        // 3. Encendemos el motor
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const proveedorGoogle = new GoogleAuthProvider();

        // 4. Conectamos los botones
        const btnForjar = document.getElementById("btn-forjar");
        const btnGoogle = document.getElementById("btn-google");

        // --- FUNCIÓN 1: REGISTRO CON CORREO ---
        btnForjar.addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            const passConfirm = document.getElementById("confirm-password").value;

            if (pass !== passConfirm) {
                alert("Las contraseñas no coinciden. Intenta de nuevo.");
                return;
            }

            if (pass.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            try {
                // Intenta crear la cuenta
                await createUserWithEmailAndPassword(auth, email, pass);
                Swal.fire({
    title: '¡Expediente Forjado!',
    text: 'Bienvenid@ a la nueva realidad.',
    icon: 'success',
    background: '#09090b',
    color: '#ffffff',
    confirmButtonColor: '#ffffff',
    confirmButtonText: '<span style="color:#000; font-weight:600;">Entrar a Krow</span>'
    }).then(() => {
      window.location.href = "hub.html";
});

            } catch (error) {
                alert("Hubo un error: " + error.message);
            }
        });

        // --- FUNCIÓN 2: REGISTRO CON GOOGLE ---
        btnGoogle.addEventListener("click", async () => {
            try {
                // Abre la ventanita de Google
                const resultado = await signInWithPopup(auth, proveedorGoogle);
                Swal.fire({
    title: '¡Acceso Concedido!',
    text: 'Bienvenid@ a Krow, ' + resultado.user.displayName,
    icon: 'success',
    background: '#09090b',
    color: '#ffffff',
    confirmButtonColor: '#ffffff',
    confirmButtonText: '<span style="color:#000; font-weight:600;">Entrar a Krow</span>'
});

            } catch (error) {
                alert("Error con Google: " + error.message);
            }
        });
    </script>
</body>
</html>
